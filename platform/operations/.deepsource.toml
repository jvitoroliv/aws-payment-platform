# generated by https://github.com/example-org/fabric-deepsource-ops
# see https://docs.deepsource.com/docs/analyzers for more docs on config
# Changes to this file should be validated using the DeepSource CLI command:
# deepsource config validate
# See https://docs.deepsource.com/cli for more info.
version = 1

exclude_patterns = [
    "terraform/**/.terraform/**",
]

test_patterns = [
    "**/*_test.go"
]

[[analyzers]]
name = "docker"
enabled = true

  [analyzers.meta]
  dockerfile_paths = [
    "docker/Dockerfile.tag-terraform"
  ]

  trusted_registries = [
    "registry.example.io",
    "euartifactoryexample-org.jfrog.io",
    "docker.io",
    "hub.docker.com",
    "ghcr.io"
  ]

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "go"
enabled = true

  [analyzers.meta]
  import_root = "github.com/example-org/ps-tag-ops"  # required

[[analyzers]]
name = "terraform"
enabled = true

[[analyzers]]
name = "shell"
enabled = true

  [analyzers.meta]
  dialect = "bash"

[[transformers]]
name = "gofmt"
enabled = true
