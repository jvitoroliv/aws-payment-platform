<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="utf-8">
    <title>Transact Global</title>

    <!-- build:css -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/bootstrap-theme.min.css">
    <link rel="stylesheet" href="css/bootstrap-datepicker3.css">
    <link rel="stylesheet" href="css/site-custom.css">
    <link rel="stylesheet" href="css/alerts.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/select2.css">
    <link rel="stylesheet" href="css/select2-bootstrap.css">
    <!-- endbuild -->

    <link rel="icon" type="image/png" href="/images/favicon.ico"/>
</head>


<body>
<div id="globe"></div>
<div class="container" style="position: relative;">
    <div class="header">
        <div class="navbar">
            <div class="navbar-inner">
                <div id="header-region"></div>
            </div>
        </div>
    </div>

    <div id="wrap">
        <div id="appnav-region"></div>

        <div style="padding: 5em">
            <h2><strong>Your browser is unsupported.</strong></h2>
            <br>
            <p>Please upgrade to one of the following supported browsers:</p>
            <br>
            <div class="browser-link-container">
                <a class="firefox" href="http://www.mozilla.com/firefox/" target="_blank">
                    <span class="browser">Firefox</span>
                    <span class="vendor">Mozilla Foundation</span>
                </a>

                <a class="chrome" href="https://www.google.com/chrome/browser/desktop/" target="_blank">
                    <span class="browser">Chrome</span>
                    <span class="vendor">Google</span>
                </a>

                <a class="ie" href="http://windows.microsoft.com/en-US/internet-explorer/downloads/ie" target="_blank">
                    <span class="browser">Internet Explorer</span>
                    <span class="vendor">Microsoft</span>
                </a>
            </div>
        </div>


        <div id="footer-region"></div>
        <div class="clearfix"></div>
    </div>
    <footer>
        <span class="copyright pull-right">&copy; 2015 AOC Solutions | All Rights Reserved</span>
    </footer>
</div>


</body>
</html>
