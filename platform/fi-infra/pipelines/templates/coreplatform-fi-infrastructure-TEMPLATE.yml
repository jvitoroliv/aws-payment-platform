# File: coreplatform-fi-infrastructure-FINSERV_PROD_TEMPLATE.yml
# Purpose: A majority of the pipelines are identical, this template will be helpful in isolating 
# and better encapsulating common functionality, as well as enforcing DRY (Don't repeat yourself)

parameters:
- name: EnvironmentName
  default: 'FINSERV_QA'
- name: AgentPoolName
  type: string
  values:
  - CpAWS-Demo
  - CpAWS-QA
  - CpAWS-qa-finserv
  - CpAWS-UAT
  - CpAWS-UATDR
  - CpAWS-Prod
  default: CpAWS-QA
- name: BranchForTerraformPlan
  default: ''
- name: JobName
  default: 'Phase_1'
- name: DependsOn
  default: ''


jobs:
- job: ${{ parameters.JobName }}
  dependsOn: 
  - ${{ if ne(parameters.DependsOn, '') }}:
    - ${{ parameters.DependsOn }}
  variables:
  - name: branchArgs
    #if branch parameter is provided then it will be appended to the arguments for task with displayName: Terraform Plan 
    ${{if ne(parameters.BranchForTerraformPlan,'')}}:
      value: -var branch=${{parameters.BranchForTerraformPlan}}
  displayName: Agent job 1
  pool: ${{ parameters.AgentPoolName }}
  steps:
  - checkout: self
    clean: true
    persistCredentials: True
 
   # Prefixing git urls with the SYSTEM_ACCESSTOKEN
  - template: rewriteTerraformGitUrlsToIncludeToken.yml

  - script: |
      terraform init -input=false
    workingDirectory: env\${{parameters.EnvironmentName}}
    displayName: terraform init

  # - script: |
  #     export TF_IN_AUTOMATION=true
  #     terraform state list
  #   workingDirectory: env\${{parameters.EnvironmentName}}
  #   condition: eq(variables['System.debug'], 'true')
  #   displayName: 'terraform state list'
          
  - script: |
      terraform plan -out terraform.tfplan $(branchArgs)
    workingDirectory: env\${{parameters.EnvironmentName}}
    displayName: terraform plan
 
  - script: |
      terraform apply terraform.tfplan
    workingDirectory: env\${{parameters.EnvironmentName}}
    displayName: terraform apply