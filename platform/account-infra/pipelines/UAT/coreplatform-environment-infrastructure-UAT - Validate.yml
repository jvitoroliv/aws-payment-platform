# 'Allow scripts to access the OAuth token' was selected in pipeline.  Add the following YAML to any steps requiring access:
#       env:
#           MY_ACCESS_TOKEN: $(System.AccessToken)
# Variable 'Environment' was defined in the Variables tab
name: coreplatform-environment-infrastructure-UAT-Validate$(rev:.rr)


parameters:
- name: Environment
  default: 'UAT'

trigger:
  branches:
    include:
    - refs/heads/master
jobs:
- job: Phase_1
  displayName: Agent job 1
  pool:
    name: CpAWS-UAT
  steps:
  - checkout: self
    clean: true
    persistCredentials: True
  - task: PowerShell@1
    name: PowerShell5
    displayName: Configure Git Client
    inputs:
      scriptType: inlineScript
      inlineScript: 'git config --global http.extraheader "AUTHORIZATION: bearer $env:SYSTEM_ACCESSTOKEN"'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # Prefixing git urls with the SYSTEM_ACCESSTOKEN
  - template: ../templates/rewriteTerraformGitUrlsToIncludeToken.yml

  - task: PowerShell@1
    name: PowerShell3
    displayName: Validate
    env:
      SYTEM_ACCESSTOKEN: $(System.AccessToken)
    inputs:
      scriptName: validate.ps1
      arguments: ${{ parameters.Environment }}
      inlineScript: "$envlist = @(\"DEV\",\"QA\",\"PAT\",\"UAT\",\"PROD\",\"DR\",\"DEMO\")\n\nforeach ($env in $envlist) {\n  $path = \"env\\${env}\"\n  write-host \"========================================\"\n  write-host \"Testing terraform for environment $env\"\n  \n  if (test-path $path) {\n    write-host\n    pushd $path\n\n    terraform init -input=false\n    terraform plan -out terraform.tfplan\n\n    popd\n  } else {\n    write-warning \"Path $path does not exist, skipping\"\n  }\n}\n"
  - task: PowerShell@1
    name: PowerShell6
    displayName: Clean Git Client
    condition: always()
    inputs:
      scriptType: inlineScript
      inlineScript: git config --global --unset http.extraheader
...
