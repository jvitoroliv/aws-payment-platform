# build-service.yaml
# build pipeline

---
name: TAG CI Workflow

permissions:
  contents: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      deepsource_dsn_vault_path:
        description: "The path to the Deepsource DSN in Vault. If left empty then code coverage will not be reported."
        type: string
        required: false
        default: ''
      version:
        description: The semver of the workflow for automated tagging.
        type: string
        required: false
        default: 1.3.1
      trigger_image_push:
        description: "Toggles whether to push the images to Artifactory."
        type: boolean
        required: false
        default: false

    outputs:
      app_version:
        description: "The application version generated in the build."
        value: ${{ jobs.generate-release-version.outputs.VERSION }}

jobs:
  # Generates a new release version for PRs and for Merges
  generate-release-version:
    name: Get Release Version
    runs-on: ["tag-dev", "self-hosted"]
    outputs:
      VERSION: ${{ steps.get-version.outputs.VERSION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          fetch-tags: 'true'

      - name: Get Release Version
        id: get-version
        run: |
          echo "${{github.event.repository.default_branch}}"

          VERSION_PREFIX=$(head -n 1 version.md)
          # Validate version.md format (should be major.minor only)
          if ! [[ "$VERSION_PREFIX" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format in version.md. Expected format: major.minor (e.g., 1.0)"
            exit 1
          fi
          LATEST_TAG=$(git tag -l "v${VERSION_PREFIX}.*" | sort -V | tail -n 1)
          if [ "${{ github.ref }}" == "refs/heads/${{github.event.repository.default_branch}}" ]; then
            if [ -z "$LATEST_TAG" ]; then
              # First version
              VERSION="v${VERSION_PREFIX}.0"
            else
              # Increment patch version
              PATCH=$(echo $LATEST_TAG | cut -d. -f3)
              PATCH=$((PATCH + 1))
              VERSION="v${VERSION_PREFIX}.${PATCH}"
            fi
          else
            if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v${VERSION_PREFIX}.0"
          fi
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # PR version format
            typeset -l VERSION="${LATEST_TAG}-${{ github.event.pull_request.head.ref }}-${{ github.run_number }}"
            # Removing any characters that aren't lowercase letters, numbers, underscores or hyphens
            VERSION=${VERSION//![^a-z0-9_-]}
          else
            # Other branches version format
            VERSION="${LATEST_TAG}-${{ github.sha }}"
            fi
          fi

          echo "VERSION=$VERSION" | tee -a $GITHUB_ENV $GITHUB_OUTPUT

  # Builds and Tests the GO project via Make
  build-and-test:
    name: Build and Test
    runs-on: ["tag-dev", "self-hosted"]
    needs: generate-release-version
    env:
      VERSION: "${{ needs.generate-release-version.outputs.VERSION }}"
    steps:
      - name: Fix Workspace Permissions
        run: sudo chmod -R ugo+rwx ${GITHUB_WORKSPACE}

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Note: Use the Terraform source from the same commit as the workflow
          ref: ${{ github.head_ref }}
          fetch-tags: 'true'

      - name: Set Compose Project Name
        run: |
          typeset -l COMPOSE_PROJECT_NAME="${{ github.repository }}-${{ github.workflow }}-${{ github.run_number }}-${{ github.run_attempt }}"

          # Replace unwanted special characters with hyphens, then remove repo org name
          COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME//[^a-z0-9._-]/-}
          COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME#*-}

          # Set version to env and output
          echo "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME" | tee -a $GITHUB_ENV $GITHUB_OUTPUT

      - name: Get Read Only Token
        id: generate-token
        uses: example-org/shared-actions/github/app-token@v1
        with:
          secret: ${{ secrets.FABRIC_SHARED_ACTION_READONLY_KEY }}

      - name: Get Deepsource DSN
        if: ${{ inputs.deepsource_dsn_vault_path != '' }}
        uses: example-org/shared-actions/fabric/vault@v1
        with:
          secrets: |
            ${{ inputs.deepsource_dsn_vault_path }} | DEEPSOURCE_DSN

      - name: Pull Docker Compose Dependencies
        run: |
          make -f ci.mk ci-pull

      - name: Run Build
        run: |
          make -f ci.mk ci-build
        env:
          GITHUB_USERNAME: noop
          GITHUB_AUTH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Run Tests
        run: |
          make -f ci.mk ci-test

      - name: Check Test Report Files
        id: test-results
        if: success() || failure()
        run: |
          # The Test Results markdown file is added to the step summary and as a PR comment if present
          if [ -f test-results.md ]; then
            echo "Test results markdown file found"
            echo "test_results_file_present=true" >> "$GITHUB_OUTPUT"
            cat test-results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test results markdown file found"
            echo "::warning title=Test results file not present::No test results markdown file found (test-results.md)"
            echo "test_results_file_present=false" >> "$GITHUB_OUTPUT"
          fi

          # The Test coverage file is sent to DeepSource if present
          if [ -f coverage.out ]; then
            echo "Test coverage file found"
            echo "test_coverage_file_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Test coverage file file found"
            echo "::warning title=Test coverage file not present::No Test coverage file file found (coverage.out)"
            echo "test_coverage_file_present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: thollander/actions-comment-pull-request@v3
        if: ${{ github.event_name == 'pull_request' && steps.test-results.outputs.test_results_file_present == 'true' && (success() || failure()) }}
        with:
          comment-tag: "test-results"
          file-path: ${{ github.workspace }}/test-results.md

      - name: Deepsource Test Coverage Report
        if: ${{ inputs.deepsource_dsn_vault_path != '' && steps.test-results.outputs.test_coverage_file_present == 'true' && (success() || failure()) }}
        uses: deepsourcelabs/test-coverage-action@master
        with:
          key: go
          coverage-file: ${{ github.workspace }}/coverage.out
          dsn: ${{ env.DEEPSOURCE_DSN }}
          fail-ci-on-error: true

      - name: Setup JFrog CLI
        if: inputs.trigger_image_push
        uses: example-org/shared-actions/fabric/artifactory-cli@v1
        with:
          artifactory_url: registry.example.io

      - name: Push Docker image/s
        if: inputs.trigger_image_push
        run: |
          make -f ci.mk ci-push-images

      - name: Create GitHub Release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Create and push the tag
          git tag $VERSION
          git push origin $VERSION

          # Create the release
          gh release create $VERSION \
            --title "Release $VERSION" \
            --generate-notes

      - name: Build Cleanup
        if: always()
        run: |
          make -f ci.mk ci-cleanup

      - name: Runner Cleanup
        if: always()
        run: |
          echo "Usage stats before cleanup:"
          docker system df

          echo "Remove dangling Docker images:"
          docker image prune -f

          echo "Remove Docker build cache older than one week:"
          docker builder prune -f --filter "until=$((7*24))h" --verbose

          echo "Remove Docker build cache large than 50GB:"
          docker builder prune -f --keep-storage $((50*1000*1000*1000)) --verbose

          echo "Delete all local git tags:"
          git tag -l | xargs -n 1 git tag -d

          echo "Usage stats after cleanup:"
          docker system df
