---
####################
# Global RepositorySettings: https://github.com/probot/settings#usage
# Global Settings: https://github.com/example-org/global-settings
####################
_extends: ".github:.github/settings.yml"

repository:
  name: tag-platform-app-of-apps
  description: tag app of apps repository
  topics: app-of-apps, example-fabric, tag
  default_branch: main

teams:
  - name: tag-devops
    permission: push
  - name: technology
    permission: push

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        # The number of approvals required. (1-6)
        required_approving_review_count: 1
        # Dismiss approved reviews automatically when a new commit is pushed.
        dismiss_stale_reviews: false
        # Blocks merge until code owners have reviewed.
        require_code_owner_reviews: true
        # Specify which users and teams can dismiss pull request reviews. Pass an empty dismissal_restrictions object
        # to disable. User and team dismissal_restrictions are only available for organization-owned repositories. Omit
        # this parameter for personal repositories.
        dismissal_restrictions:
          users: []
          teams: []

      # Required. Enforce all configured restrictions for administrators. Set to true to enforce required status checks
      # for repository administrators. Set to null to disable.
      enforce_admins: true

      # Prevent merge commits from being pushed to matching branches
      required_linear_history: true

      required_conversation_resolution: true

      # Required. Require status checks to pass before merging. Set to null to disable
      required_status_checks:
        # Required. Require branches to be up-to-date before merging.
        strict: true
        # Required. The list of status checks to require in order to merge into this branch
        contexts: []

      # Required. Restrict who can push to this branch. Team and user restrictions are only available for
      # organization-owned repositories. Set to null to disable.
      # Enabling this setting will prevent some from being able to merge PRs.
      restrictions: null