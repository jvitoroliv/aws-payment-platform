# retrieve_ado_workitem_title.yaml
# retrieve_ado_workitem_title configuration

name: Work Item Title
on:
  workflow_dispatch:

jobs:
  run-action:
    name: Run action
    runs-on: coreplatform-dev

    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js 16.x
        uses: actions/setup-node@v2
        with:
          node-version: 16.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run my action
        uses: ./
        with:
          comment: ${{ github.event.pull_request.body }}
          ghToken: ${{ secrets.PAT_GITHUB }}
          adoToken: ${{ secrets.PAT_AZUREDEVOPS }}
