---
#####################
# Global RepositorySettings: https://github.com/probot/settings#usage
# Global Settings: https://github.com/example-org/.github
#####################
_extends: '.github:.github/settings.yml'

#Set these to your values so that your topics and description are correct
repository:
  name: CoreService
  description: CorePlatform is a brandable financial insitution web application that provides corporate card managment via transaction envelopes, automated accounts payable, hiearchy submission and approval, reporting, and more.
  topics: finserv, coreplatform
  default_branch: Major
  allow_squash_merge: false
  allow_merge_commit: true
  allow_rebase_merge: false
  allow_auto_merge: true

teams:
  # Put your team name here for permissions
  - name: cpt-code-reviewers-major-branch
    permission: push
  - name: cpt-code-reviewers-def
    permission: admin

branches:
  - name: Major
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 2
        require_code_owner_reviews: true
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts: [ 'codebuild_coreplatform', 'codebuild_database', 'codebuild_taskman', 'test_transforms']
      required_linear_history: false
      
      # Required. Restrict who can push to this branch. Team and user restrictions are only available for
      # organization-owned repositories. Set to null to disable.
      restrictions: null
      required_conversation_resolution: true
      
  - name: Prod 
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 2
        require_code_owner_reviews: true
        dismiss_stale_reviews: true
      required_status_checks:
        strict: false
        contexts: [ ]
      required_linear_history: false
      
      # Required. Restrict who can push to this branch. Team and user restrictions are only available for
      # organization-owned repositories. Set to null to disable.
      restrictions: null
      required_conversation_resolution: true
      
  - name: Demo
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 2
        require_code_owner_reviews: true
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts: [ ]
      required_linear_history: false
      
      # Required. Restrict who can push to this branch. Team and user restrictions are only available for
      # organization-owned repositories. Set to null to disable.
      restrictions: null
      required_conversation_resolution: true
      
  - name: OnRamp
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 2
        require_code_owner_reviews: true
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts: [ ]
      required_linear_history: false
      
      # Required. Restrict who can push to this branch. Team and user restrictions are only available for
      # organization-owned repositories. Set to null to disable..
      restrictions: null
      required_conversation_resolution: true
