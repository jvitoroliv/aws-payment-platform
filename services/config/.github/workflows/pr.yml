# pr.yml — pr configuration

# pr.yml — pr configuration

name: PR Workflow

on:
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: CI Pipeline
    runs-on: ["tag-dev", "self-hosted"]
    steps:
      - name: Set permissions to allow checkout action to clean the workspace
        run: |
          sudo chmod -R ug+rwX ${GITHUB_WORKSPACE}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.19'

      - name: Pull Dependencies
        run: make ci-pull

      - name: Build
        run: make ci-build

      - name: Test
        run: make ci-test

      - name: Cleanup
        if: always()
        run: make ci-cleanup

      - name: Job Summary
        run: |
          echo "## PR Workflow Results" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| ---- | ------ |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY