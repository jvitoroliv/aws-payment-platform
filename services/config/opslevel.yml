# opslevel.yml
# opslevel configuration

---
version: 1
service:
  name: TAG Config Service
  lifecycle: pre-alpha
  tier: tier_4
  product: TAG
  owner: tag
  system: tag
  language: golang
  framework: other
  description: This module is to be used by all Platform TAG services in order to keep
    application configuration consistent. The basic usage is just the plain yaml package
    but, the real benefits come from the Accessors implementation
  aliases:
  - example-org/ps-tag-config
  tags:
    - key: containerized
      value: no
    - key: pci
      value: no
    - key: scope
      value: internal
    - key: type
      value: other
  repositories:
  - name: example-org/ps-tag-config
    path: "/"
    provider: github
  tools: []
  dependencies: []
