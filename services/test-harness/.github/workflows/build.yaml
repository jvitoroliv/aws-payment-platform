# build.yaml
# build pipeline

---
name: Manual Build & Test
run-name: Manual Build and Test by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      trigger_image_push:
        description: Triggers whether the image should be pushed to the nonprod Artifactory repo.
        required: false
        type: boolean
        default: false
      trigger_release_creation:
        description: Triggers whether the release should be created.
        required: false
        type: boolean
        default: false

jobs:
  ci:
    name: CI
    uses: example-org/shared-actions/.github/workflows/build-service.yaml@build-service-v1
    with:
      trigger_image_push: ${{ inputs.trigger_image_push }}
      trigger_release_creation: ${{ inputs.trigger_release_creation }}
    secrets: inherit
