# deploy-workflow.yml — deployment automation

name: Deploy Workflow

on:
  workflow_dispatch:
    inputs:
      SEMANTIC_VERSION:
        description: 'Semantic Version'
        required: true
        type: string
        default: '0.0.1'

jobs:
  test-and-git-tag:
    runs-on: team-dev
    container:
      image: registry.example.io/docker-prod/app/tag-utilities/builder:1.21.3
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test
        run: |
          go mod vendor
          go test ./log

      - name: Set up Git
        run: |
          git config user.name 'Jenkins'
          git config user.email 'user@example-company.com'

      - name: Create Git Tag
        run: |
          git tag -a v${{ github.event.inputs.SEMANTIC-VERSION }} -m "Log Version ${{ github.event.inputs.SEMANTIC-VERSION }}"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git v${{ github.event.inputs.SEMANTIC-VERSION }}