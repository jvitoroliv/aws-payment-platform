# merge-workflow.yml — merge-workflow configuration

# merge-workflow.yml — merge-workflow configuration

name: Merge Build
run-name: Merge Build ${{ github.sha }} by @${{ github.actor }}

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build and Deploy to Dev
    runs-on: ["tag-dev", "self-hosted"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Version
        id: version
        run: |
          # Replica a lógica do Jenkins: "RC-${SCM_CHECKOUT.GIT_COMMIT}"
          VERSION="RC-${{ github.sha }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build Description
        run: |
          echo "## Merge Build" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY

      - name: Unit Tests
        run: |
          docker-compose -f docker/builder/docker-compose.yml build builder
          docker-compose -f docker/builder/docker-compose.yml run --rm builder bash -c "make test"
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for Artifactory
        run: |
          docker-compose -f docker/builder/docker-compose.yml run --rm builder bash -c './scripts/build_artifactory.sh ${{ steps.version.outputs.VERSION }}'
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Artifactory
        run: |
          docker run --rm \
            -v $(pwd):/workspace \
            -w /workspace \
            -e JFROG_CLI_OFFER_CONFIG=false \
            releases-docker.jfrog.io/jfrog/jfrog-cli-v2-jf:latest \
            bash -c "
              jf c add --url=https://registry.example.io/ --access-token=${{ secrets.JFROG_ACCESS_TOKEN }}
              jf rt u 'dist-files/*' tag-generic-nonprod-federated-us/chronos/${{ steps.version.outputs.VERSION }}/ --build-name ps-tag-chronos --build-number ${{ steps.version.outputs.VERSION }} --module lambdas
              jf rt build-publish ps-tag-chronos ${{ steps.version.outputs.VERSION }}
            "

      - name: Deploy to DEV Environment
        id: deploy-dev
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-chronos.yml',
              ref: context.ref,
              inputs: {
                environment: 'dev',
                region: 'us-east-1',
                application_version: '${{ steps.version.outputs.VERSION }}',
                run_oneshots: 'true'
              }
            });
            
            console.log('DEV deployment triggered with OneShots enabled');
            
            // Wait for workflow to start
            await new Promise(resolve => setTimeout(resolve, 10000));
            
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-chronos.yml',
              head_sha: context.sha,
              per_page: 1
            });
            
            if (runs.data.workflow_runs.length > 0) {
              const runId = runs.data.workflow_runs[0].id;
              console.log(`Deployment started: ${runs.data.workflow_runs[0].html_url}`);
              
              // Monitor deployment progress
              let attempts = 0;
              const maxAttempts = 60;
              
              while (attempts < maxAttempts) {
                const run = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId
                });
                
                console.log(`Deployment status: ${run.data.status}, conclusion: ${run.data.conclusion}`);
                
                if (run.data.status === 'completed') {
                  if (run.data.conclusion === 'success') {
                    console.log('✅ DEV deployment completed successfully');
                    break;
                  } else {
                    throw new Error(`❌ DEV deployment failed: ${run.data.conclusion}`);
                  }
                }
                
                attempts++;
                await new Promise(resolve => setTimeout(resolve, 30000));
              }
              
              if (attempts >= maxAttempts) {
                throw new Error('DEV deployment timed out after 30 minutes');
              }
              
              return runId;
            } else {
              throw new Error('Could not find deployment workflow run');
            }

      - name: Reset Dev Database
        run: |
          docker run --rm \
            -v $(pwd)/automated-tests/seed-data:/workspace \
            -w /workspace \
            mongo:7.0 \
            bash -c "
              mongosh 'mongodb+srv://test-cluster.example.mongodb.net/chronos' --username $ATLAS_USER --password $ATLAS_PASSWORD --eval 'db.dropDatabase()'
              mongosh 'mongodb+srv://test-cluster.example.mongodb.net/chronos' --username $ATLAS_USER --password $ATLAS_PASSWORD data.js
            "
          echo 'Dev Database was reset'
        env:
          ATLAS_USER: ${{ secrets.ATLAS_DEV_ADMIN_USER }}
          ATLAS_PASSWORD: ${{ secrets.ATLAS_DEV_ADMIN_PASSWORD }}

      - name: Run Automation Tests
        run: |
          chmod +x ./automated-tests/docker/run_automation_aws.sh
          ./automated-tests/docker/run_automation_aws.sh dev us-east-1
        env:
          ENVIRONMENT: dev

      # Commented out as in the original Jenkinsfile
      # - name: Deploy to TEST Environment
      #   if: false  # Disabled as in original
      #   uses: actions/github-script@v7
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     script: |
      #       await github.rest.actions.createWorkflowDispatch({
      #         owner: context.repo.owner,
      #         repo: context.repo.repo,
      #         workflow_id: 'deploy-chronos.yml',
      #         ref: context.ref,
      #         inputs: {
      #           environment: 'test',
      #           region: 'us-east-1',
      #           application_version: '${{ steps.version.outputs.VERSION }}',
      #           run_oneshots: 'false'
      #         }
      #       });

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f ./docker/builder/docker-compose.yml down || true

      - name: Generate Build Report
        if: always()
        run: |
          echo "## Merge Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Build completed successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Completed Steps:" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Unit Tests" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Artifactory Upload" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ DEV Deployment (with OneShots)" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Database Reset" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Automation Tests" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Version `${{ steps.version.outputs.VERSION }}` is ready for promotion to higher environments.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build failed**" >> $GITHUB_STEP_SUMMARY
          fi