# docker-compose-localstack.yml — local value computations

services:
  localstack:
    image: public.ecr.aws/localstack/localstack:latest
    container_name: payment-service-localstack
    privileged: true
    ports:
      - "4566-4599:4566-4599"
    volumes:
      - ./scripts/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: >
        curl -sf http://localhost:4566/_localstack/init/ready | grep -q '"completed": true,'
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
    networks:
      - local

networks:
  local:
    name: payment-service-local
