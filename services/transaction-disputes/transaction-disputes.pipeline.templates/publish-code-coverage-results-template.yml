# publish-code-coverage-results-template.yml
# publish-code-coverage-results-template configuration
# Maintained by: Platform Engineering

# publish-code-coverage-results-template.yml — publish-code-coverage-results-template configuration

parameters:
- name: AGENT_POOL_NAME
  type: string
- name: DEPENDENT_JOB_NAME
  type: string
- name: JOB_NAME
  type: string

jobs:
- job: '${{ parameters.JOB_NAME }}'
  displayName: "Publish code coverage results"
  dependsOn: '${{ parameters.DEPENDENT_JOB_NAME }}'
  workspace:
    clean: all
  variables:
    disable.coverage.autogenerate: 'true'
    CoverageReportFolderName: 'CoverageReport'
  pool:
    name: '${{ parameters.AGENT_POOL_NAME }}'

  steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'
    
    - task: DownloadPipelineArtifact@2
      inputs:
        path: '$(System.ArtifactsDirectory)'
      displayName: 'Download code coverage results'
      enabled: true

    - task: reportgenerator@5
      displayName: 'Build code coverage report'
      inputs:
        reports: '$(System.ArtifactsDirectory)/**/*.xml'
        targetdir: '$(System.ArtifactsDirectory)/$(CoverageReportFolderName)'
        title: 'Code Coverage'
      enabled: true

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish code coverage report'
      inputs:
        summaryFileLocation: '$(System.ArtifactsDirectory)/$(CoverageReportFolderName)/*.xml'
      enabled: true
