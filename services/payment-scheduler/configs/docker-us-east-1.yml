# docker-us-east-1.yml
# docker-us-east-1 configuration

# GitHub Environment — enables deployment protection rules and secrets scoping
environment: docker
awsRegion: east
scheduler:
  cron: "0/1 * * * *"
processor:
  postPaymentTimeout: 3
  postPaymentMaxRetries: 3
  maxConsecutiveFailures: 3
mongo:
  dbName: payment_scheduler
  username:
  password:
  uri: mongodb://mongo-database:27017
  connectTimeout: 5
  clientTimeout: 2
server:
  addr: ":7000"
  ginMode: "debug"
  timeout: 10
tagCore:
  baseURL: http://tag-core:1080
  timeout: 3
  maxRetries: 3
  username: any
  password: any