# dev-us-west-2.yml
# dev-us-west-2 configuration

# GitHub Environment — enables deployment protection rules and secrets scoping
environment: dev
awsRegion: us-west-2
scheduler:
  cron: "0/5 * * * *"
processor:
  postPaymentTimeout: 3
  postPaymentMaxRetries: 3
  maxConsecutiveFailures: 3
mongo:
  dbName: payment_scheduler
  username: "payments"
  password: "{SECRET:dev_payments_mongo_pw}"
  uri: mongodb+srv://test-cluster.example.mongodb.net/test?retryWrites=true&w=2
server:
  addr: ":8001"
  ginMode: "debug"
  timeout: 10
tagCore:
  baseURL: "https://api.internal.dev.platform.example.com"
  timeout: 3
  maxRetries: 3
  username: paymentSchedulerApiUser
  password: "{SECRET:dev_payments_tag_core_pw}"