# docker-compose.m1mac_override.yml
# local development environment

services:
  payment-scheduler-api:
    cap_add:
      - SYS_PTRACE
    ports:
      - "8000:7000"
      - "49092:40000"
    command:
      - /debug/build/dlv
      - --listen=:40000
      - --log
      - --headless=true
      - --api-version=2
      - --accept-multiclient
      - exec
      - /debug/build/payment-scheduler-api
      - --continue
