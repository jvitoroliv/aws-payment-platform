            aws_region_line=$(grep -E "^\s*aws_region\s*=" "$file" || echo "")
            if [ -n "$aws_region_line" ]; then
              # Extract value between quotes
              aws_region_value=$(echo "$aws_region_line" | sed -E 's/.*=\s*"([^"]+)".*/\1/')
              echo "${var_prefix}_region = $aws_region_value"
              echo "${var_prefix}_region=$aws_region_value" >> $GITHUB_OUTPUT
            else
              echo "${var_prefix}_region = não encontrado"
              echo "${var_prefix}_region=não encontrado" >> $GITHUB_OUTPUT
            fi
            
            # Search for environment
            environment_line=$(grep -E "^\s*environment\s*=" "$file" || echo "")
            if [ -n "$environment_line" ]; then
              # Extract value between quotes
              environment_value=$(echo "$environment_line" | sed -E 's/.*=\s*"([^"]+)".*/\1/')
              echo "${var_prefix}_environment = $environment_value"
              echo "${var_prefix}_environment=$environment_value" >> $GITHUB_OUTPUT
            else
